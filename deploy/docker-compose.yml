# Usage (on the VPS):  DOMAIN=play.example.com docker compose up -d --build
services:
  game:
    build: ..
    restart: unless-stopped
    expose: ["8080"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN, e.g. play.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [game]
volumes:
  caddy_data:
  caddy_config:
